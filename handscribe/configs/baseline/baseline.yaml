wandb:
  wandb_project: handscribe
  wandb_entity: carp1
  wandb_mode: offline
feeder: handscribe.dataset.dataloader_video.BaseFeeder
phase: train
# dataset: phoenix2014-T
num_epoch: 80
work_dir: handscribe/work_dir/baseline_res18/
batch_size: 2
random_seed: 42
test_batch_size: 2
num_worker: 0
log_interval: 100
eval_interval: 1
save_interval: 5
# python in default
evaluate_tool: python
loss_weights:
  # Slow: 0.25
  # Fast: 0.25
  CrossEntropy: 0.5
  CrossRougeEntropy: 0.5
#load_weights: ''

optimizer_args:
  optimizer: AdamW
  base_lr: 0.0001
  momentum: 0.95
  scheduler: "multistep"
  warmup_epochs: 5
  # step: [[40, 60], [20, 40, 60]]
  step: [[40, 60]]
  gamma: 0.2
  weight_decay: 0.0001
  start_epoch: 0
  nesterov: True

feeder_args:
  mode: 'train'
  datatype: 'video'
  num_gloss: -1
  drop_ratio: 1.0
  frame_interval: 1
  image_scale: 1.0  # 0-1 represents ratio, >1 represents absolute value
  input_size: 224

model: slt_network_parallel.SLTModelParallel
slowfast_config: SLOWFAST_64x2_R101_50_50.yaml
model_args:
  num_classes: 1296
  c2d_type: slowfast101 #resnet18, mobilenet_v2, squeezenet1_1, shufflenet_v2_x1_0, efficientnet_b1, mnasnet1_0, regnet_y_800mf, vgg16_bn, vgg11_bn, regnet_x_800mf, regnet_x_400mf, densenet121, regnet_y_1_6gf
  conv_type: 2
  use_bn: 1
  weight_norm: False
  backbone: slowfast

decoder: handscribe.utils.decoder.SingleDecoderHead
decoder_args:
  # projector_type:   GFProjectionLayer #GFResidualProjectionLayer
  projector_args:
    input_dim: 1024
    hidden_dim: 512
    mbart_dim: 1024
    nhead: 4
    num_layers: 1
